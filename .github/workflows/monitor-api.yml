name: Monitor Google Health API

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write # needed to commit updated snapshots
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- Signal 1: API discovery document ---
      # Standard Google API endpoint that lists all methods, fields, and enums.
      # Returns 200 with JSON if publicly accessible; some APIs require auth (we handle both).
      - name: Fetch API discovery document
        run: |
          STATUS=$(curl -sf -o /tmp/discovery.json -w "%{http_code}" \
            "https://health.googleapis.com/\$discovery/rest?version=v4" || echo "000")
          echo "DISCOVERY_STATUS=$STATUS" >> "$GITHUB_ENV"

      # --- Signal 2: googleapis/googleapis repo ---
      # Google publishes API proto definitions here. New data types or breaking
      # changes to the Health API surface here before they hit the REST docs.
      - name: Fetch googleapis/googleapis commits for the Health API path
        run: |
          curl -sf \
            "https://api.github.com/repos/googleapis/googleapis/commits?path=google%2Fhealth&per_page=10" \
            -H "Accept: application/vnd.github+json" \
            -o /tmp/googleapis-commits.json \
            || echo "[]" > /tmp/googleapis-commits.json

      - name: Compare against stored snapshots
        id: detect
        run: |
          mkdir -p .github/api-snapshot
          CHANGES=""

          # -- Discovery document --
          if [ "$DISCOVERY_STATUS" = "200" ]; then
            if [ -f .github/api-snapshot/discovery.json ]; then
              DIFF=$(diff .github/api-snapshot/discovery.json /tmp/discovery.json || true)
              if [ -n "$DIFF" ]; then
                CHANGES="${CHANGES}### API Discovery Document\n\`\`\`diff\n$(echo "$DIFF" | head -150)\n\`\`\`\n\n"
                cp /tmp/discovery.json .github/api-snapshot/discovery.json
              fi
            else
              cp /tmp/discovery.json .github/api-snapshot/discovery.json
              CHANGES="${CHANGES}### API Discovery Document\nInitial snapshot established — future runs will diff against this baseline.\n\n"
            fi
          else
            echo "Discovery endpoint returned HTTP $DISCOVERY_STATUS (may require auth) — skipping."
          fi

          # -- googleapis/googleapis commits --
          NEW_SHA=$(jq -r '.[0].sha // ""' /tmp/googleapis-commits.json)
          STORED_SHA=$(cat .github/api-snapshot/googleapis-sha.txt 2>/dev/null || echo "")
          if [ -n "$NEW_SHA" ] && [ "$NEW_SHA" != "$STORED_SHA" ]; then
            COMMIT_LIST=$(jq -r \
              '.[] | "- \(.commit.message | split("\n")[0]) — \(.html_url)"' \
              /tmp/googleapis-commits.json)
            CHANGES="${CHANGES}### googleapis/googleapis — google/health path\n${COMMIT_LIST}\n\n"
            echo "$NEW_SHA" > .github/api-snapshot/googleapis-sha.txt
          fi

          echo "has_changes=$([ -n "$CHANGES" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          printf '%b' "$CHANGES" > /tmp/changes.txt

      - name: Commit updated snapshots
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/api-snapshot/
          git diff --cached --quiet \
            || git commit -m "chore: update Google Health API snapshots [skip ci]"
          git push

      - name: Create or comment on tracking issue
        if: steps.detect.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "api-update" \
            --color "e4e669" \
            --description "Google Health API change detected by monitor" \
            2>/dev/null || true

          EXISTING=$(gh issue list \
            --label "api-update" --state open \
            --json number --jq '.[0].number // empty')

          CHANGES=$(cat /tmp/changes.txt)
          DATE=$(date +%Y-%m-%d)

          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "Google Health API changes detected — $DATE" \
              --label "api-update" \
              --body "$(printf \
'## Google Health API — change detected %s

The weekly monitor found changes. Review the diff below and update the project as needed.

**Checklist:**
- [ ] Review the diff below
- [ ] Add/remove data types in `src/data-types.ts`
- [ ] Add/remove MCP tools in `src/tools.ts`
- [ ] Update tests if tool signatures changed
- [ ] Close this issue

---

%s

---
*Generated by `.github/workflows/monitor-api.yml`*' \
                "$DATE" "$CHANGES")"
          else
            gh issue comment "$EXISTING" \
              --body "$(printf 'New changes detected on %s:\n\n%s' "$DATE" "$CHANGES")"
          fi
